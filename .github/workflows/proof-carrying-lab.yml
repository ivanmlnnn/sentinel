name: Sentinel Proof-Carrying Lab
on:
  push:
    branches: ["lab/proof-carrying-agent-economy"]
    paths: ["labs/proof-carrying/**", "signer-worker/src/index.mjs", "functions/api/**", "src/**", "migrations-d1/**", "migrations-signer/**", "tests/**", "payment-contract/**", "docs/AI_AUDIT_INDEX.md", "docs/AI_AUDIT_MANIFEST.json", "README.md", ".github/workflows/proof-carrying-lab.yml"]
  pull_request:
    paths: ["labs/proof-carrying/**", "signer-worker/src/index.mjs", "functions/api/**", "src/**", "migrations-d1/**", "migrations-signer/**", "tests/**", "payment-contract/**", "docs/AI_AUDIT_INDEX.md", "docs/AI_AUDIT_MANIFEST.json", "README.md", ".github/workflows/proof-carrying-lab.yml"]
  workflow_dispatch:
jobs:
  repo-and-adversarial-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Test NEAR payment contract
        run: cargo test --manifest-path payment-contract/Cargo.toml
      - name: Build NEAR payment contract
        run: cargo build --manifest-path payment-contract/Cargo.toml --target wasm32-unknown-unknown --release
      - name: Install repository dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Run full Sentinel test suite
        run: npm test
      - name: Validate D1 and signer migrations
        run: npm run check:d1
      - name: Run proof-carrying adversarial tests
        working-directory: labs/proof-carrying
        run: npm test
      - name: Verify portable proof fixture
        working-directory: labs/proof-carrying
        run: npm run verify
      - name: Run local D1 signer race suite
        working-directory: labs/proof-carrying
        run: npm run test:d1
