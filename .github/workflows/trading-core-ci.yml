name: Sentinel Trading Core CI

on:
  push:
    branches:
      - feature/sentinel-trading-core-lab
  pull_request:
    branches:
      - main
      - feature/developer-mode-cyan-trade-drafts

permissions:
  contents: read

concurrency:
  group: trading-core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax checks
        run: |
          node --check src/trading-core.mjs
          node --check src/trading-intelligence.mjs
          node --check src/market-data.mjs
          node --check src/trading-agents.mjs
          node --check src/trading-swap-agents.mjs
          node --check src/trading-agent-orchestrator.mjs
          node --check src/trading-backtest.mjs
          node --check functions/api/trading-backtest.js
          node --check functions/api/trading-agent.js
          node --check functions/api/trading-analysis.js
          node --check src/index.js
          node --check functions/api/trading-tokens.js
          node --check functions/api/trading-quote.js
          node --check functions/api/trading-live-quote.js
          node --check functions/api/trading-generate-intent.js
          node --check functions/api/trading-submit-intent.js
          node --check functions/api/trading-status.js
          node --check functions/api/trading-key-status.js
          node --check functions/api/trading-deposit-submit.js
          node --check api/trading/live-quote.js
          node --check api/trading/generate-intent.js
          node --check api/trading/submit-intent.js
          node --check api/trading/status.js
          node --check api/trading/key-status.js
          node --check api/trading/tokens.js
          node --check api/trading/quote.js
          node --check public/trade-skill-draft.js
          node --check public/chat-swap.js
          node --check public/app.js
      - name: Full test suite
        run: npm test
