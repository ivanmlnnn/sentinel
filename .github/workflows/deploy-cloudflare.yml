name: Deploy Sentinel to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentinel-production
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Do not enable setup-node npm caching: this repository has no lockfile.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Require Cloudflare deployment credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }

      - name: Validate Main Worker configuration
        run: npx wrangler@4.159.0 deploy --dry-run

      - name: Validate isolated Signer Worker configuration
        run: npx wrangler@4.159.0 deploy --config signer-worker/wrangler.jsonc --dry-run

      - name: Run automated test suite
        run: npm test

      - name: Apply Main Worker D1 migrations
        run: npx wrangler@4.159.0 d1 migrations apply sentinel-db --remote

      - name: Apply isolated Signer D1 migrations
        run: npx wrangler@4.159.0 d1 migrations apply db2 --remote --config signer-worker/wrangler.jsonc

      # Reinstall the existing restricted runtime key and payment contract
      # from repository secrets on every release. Fail before deploy if either
      # credential is missing instead of publishing a nonfunctional signer.
      - name: Provision isolated signer payment credentials
        env:
          NEAR_AGENT_SIGNER_RESTRICTED_PRIVATE_KEY: ${{ secrets.NEAR_AGENT_SIGNER_RESTRICTED_PRIVATE_KEY }}
          NEAR_PAYMENT_CONTRACT_ID: ${{ secrets.NEAR_PAYMENT_CONTRACT_ID }}
          NEAR_AGENT_SIGNER_ACCOUNT_ID: ${{ secrets.NEAR_AGENT_SIGNER_ACCOUNT_ID }}
        shell: bash
        run: |
          test -n "$NEAR_AGENT_SIGNER_RESTRICTED_PRIVATE_KEY" || { echo "::error::NEAR_AGENT_SIGNER_RESTRICTED_PRIVATE_KEY is missing"; exit 1; }
          test -n "$NEAR_PAYMENT_CONTRACT_ID" || { echo "::error::NEAR_PAYMENT_CONTRACT_ID is missing"; exit 1; }
          printf '%s' "$NEAR_AGENT_SIGNER_RESTRICTED_PRIVATE_KEY" | npx wrangler@4.159.0 secret put NEAR_AGENT_SIGNER_PRIVATE_KEY --config signer-worker/wrangler.jsonc
          printf '%s' "$NEAR_PAYMENT_CONTRACT_ID" | npx wrangler@4.159.0 secret put NEAR_PAYMENT_CONTRACT_ID --config signer-worker/wrangler.jsonc
          if [ -n "$NEAR_AGENT_SIGNER_ACCOUNT_ID" ]; then
            printf '%s' "$NEAR_AGENT_SIGNER_ACCOUNT_ID" | npx wrangler@4.159.0 secret put NEAR_AGENT_SIGNER_ACCOUNT_ID --config signer-worker/wrangler.jsonc
          fi

      # The Main Worker signs each preflight assessment; the isolated Signer
      # verifies it. Generate one matching Ed25519 pair per release and install
      # each half only on its designated Worker. Values never enter the logs.
      - name: Provision matching signed-verdict keys
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { webcrypto } from "node:crypto";
          import { writeFile } from "node:fs/promises";
          const pair = await webcrypto.subtle.generateKey({ name: "Ed25519" }, true, ["sign", "verify"]);
          const privateKey = Buffer.from(await webcrypto.subtle.exportKey("pkcs8", pair.privateKey)).toString("base64");
          const publicKey = Buffer.from(await webcrypto.subtle.exportKey("raw", pair.publicKey)).toString("base64");
          await writeFile("/tmp/sentinel-verdict-private", privateKey, { mode: 0o600 });
          await writeFile("/tmp/sentinel-verdict-public", publicKey, { mode: 0o600 });
          NODE
          npx wrangler@4.159.0 secret put SENTINEL_VERDICT_PUBLIC_KEY --config signer-worker/wrangler.jsonc < /tmp/sentinel-verdict-public
          npx wrangler@4.159.0 secret put SENTINEL_VERDICT_PRIVATE_KEY < /tmp/sentinel-verdict-private
          rm -f /tmp/sentinel-verdict-private /tmp/sentinel-verdict-public

      - name: Deploy isolated Signer Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.159.0"
          command: deploy --config signer-worker/wrangler.jsonc

      - name: Deploy Main Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.159.0"
          command: deploy

      - name: Smoke test production
        run: npm run smoke:test
        env:
          SENTINEL_BASE_URL: https://sentinel.ivmaladin.workers.dev
