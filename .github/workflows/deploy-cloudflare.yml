name: Deploy Sentinel to Cloudflare Workers

on:
  push:
    branches:
      - main
      - feature/sentinel-trading-core-lab
  workflow_dispatch:

permissions:
  contents: read

# Main and isolated Signer are a single release unit. Never cancel an
# in-progress deployment between the two Worker publishes.
# The trading-core branch is deployed only through this same full test-and-release
# pipeline so its wallet approval and swap routes reach the Worker actually tested.
concurrency:
  group: sentinel-production
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Do not enable setup-node npm caching: this repository has no lockfile.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Require Cloudflare deployment credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }

      - name: Validate Main Worker configuration
        run: npx wrangler@4.159.0 deploy --dry-run

      - name: Validate isolated Signer Worker configuration
        run: npx wrangler@4.159.0 deploy --config signer-worker/wrangler.jsonc --dry-run

      - name: Run automated test suite
        run: npm test

      - name: Apply Main Worker D1 migrations
        run: npx wrangler@4.159.0 d1 migrations apply sentinel-db --remote

      - name: Apply isolated Signer D1 migrations
        run: npx wrangler@4.159.0 d1 migrations apply db2 --remote --config signer-worker/wrangler.jsonc

      - name: Deploy isolated Signer Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.159.0"
          command: deploy --config signer-worker/wrangler.jsonc

      - name: Deploy Main Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.159.0"
          command: deploy

      - name: Smoke test production
        run: npm run smoke:test
        env:
          SENTINEL_BASE_URL: https://sentinel.ivmaladin.workers.dev
