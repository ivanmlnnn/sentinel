name: Sentinel checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install project dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check browser and API JavaScript syntax
        run: |
          node --check public/auth.js
          node --check public/app.js
          node --check functions/api/investigate.js
          node --check functions/api/_shared.js
          node --check functions/api/agent.js
          node --check src/agent-policy.mjs
          node --check src/near-agent-signer.mjs
      - name: Validate Cloudflare Worker bundle
        run: npx wrangler@4.159.0 deploy --dry-run
      - name: Run test suite
        run: npm test
      - name: Run offline prompt-injection demo
        run: npm run demo:attack
      - name: Package exact source revision
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: git archive --format=tar.gz --output=sentinel-source.tar.gz "$GITHUB_SHA"
      - name: Upload source snapshot
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-source-${{ github.sha }}
          path: sentinel-source.tar.gz
          if-no-files-found: error
      - name: Attest source snapshot provenance
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: sentinel-source.tar.gz
