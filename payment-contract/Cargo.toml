[package]
name = "sentinel-payment-contract"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
near-sdk = { version = "5.17.2", features = ["legacy"] }

[dev-dependencies]
ed25519-dalek = "2.1.1"
near-sdk = { version = "5.17.2", features = ["legacy", "unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
